<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冬天出发愿望清单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Apple 风:大标题 + 四色圆环总览,磨砂分段导航,提醒事项式分组列表。固定浅色 */
:root{
  --bg:#fbfbfd; --ink:#1d1d1f; --mut:#6e6e73; --faint:#a1a1a6; --line:#e8e8ed; --fill:#f5f5f7; --card:#fff;
  --trip:#0a84ff; --trip-t:#0066cc; --eng:#ff375f; --eng-t:#d70f4b; --fit:#30d158; --fit-t:#248a3d; --pm:#bf5af2; --pm-t:#8944ab;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","PingFang SC","Noto Sans SC",sans-serif;
  --spring:cubic-bezier(.3,1.35,.5,1); --ease:cubic-bezier(.25,.1,.25,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-.01em;line-height:1.5;-webkit-font-smoothing:antialiased}
p,h1,h2,h3{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid rgba(0,113,227,.45);outline-offset:3px;border-radius:8px}
.page{max-width:820px;margin:0 auto;padding:0 22px 72px}

/* 进场 */
.rise{animation:rise .8s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}.d4{animation-delay:.34s}
@keyframes rise{from{opacity:.001;transform:translateY(18px)}}

/* 顶部 */
.hero{text-align:center;padding:88px 0 20px}
.kicker{font-size:15px;font-weight:600;color:var(--trip-t)}
h1{font-size:clamp(56px,12vw,96px);font-weight:700;letter-spacing:-.045em;line-height:1.02;margin-top:10px}
.lede{font-size:21px;color:var(--mut);margin:18px auto 0;max-width:22em;line-height:1.45}

/* 圆环总览 */
.overview{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;margin:56px auto 0;max-width:640px;background:var(--card);border-radius:28px;padding:32px 36px;box-shadow:0 4px 30px rgba(0,0,0,.06)}
.rings{width:220px;height:220px;display:block}
.rings circle{fill:none;stroke-linecap:round}
.rings .tr{opacity:.14}
.rings .pr{transition:stroke-dashoffset 1.1s var(--ease)}
.ov{display:flex;flex-direction:column;gap:16px;min-width:0}
.pct{display:flex;align-items:baseline;gap:8px}
.pct b{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#0a84ff,#bf5af2 55%,#ff375f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pct span{font-size:15px;color:var(--mut)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;text-align:left;padding:4px 0;border-radius:8px;transition:opacity .2s}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.lg span{flex:1}
.lg em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
.lg:hover{opacity:.65}
.lvl{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.lvl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.lvl-top b{font-weight:600}
.lvl-top span{color:var(--mut);font-size:13px}
.xp{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.xp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0a84ff,#bf5af2);transition:width .8s var(--spring)}
.overview.glow{animation:glow 1.2s var(--ease)}
@keyframes glow{30%{box-shadow:0 0 0 6px rgba(191,90,242,.18),0 4px 30px rgba(0,0,0,.06)}}

/* 分段导航 */
.navwrap{position:sticky;top:0;z-index:20;padding:14px 0;margin-top:56px;transition:background .3s}
.navwrap.stuck{background:rgba(251,251,253,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(118,118,128,.12);border-radius:14px;padding:3px;max-width:540px;margin:0 auto}
.ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);background:#fff;border-radius:11px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.1);transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--spring)}
.tab{position:relative;z-index:1;padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.3;font-size:15px;font-weight:500;color:var(--mut);transition:color .25s}
.tab small{font-size:11px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--faint)}
.tab.on{color:var(--ink)}
.tab.on small{color:var(--tc)}

/* 当前板块 */
#panel{transition:opacity .18s var(--ease),transform .18s var(--ease)}
#panel.out{opacity:0;transform:translateY(8px)}
#panel.in{animation:pin .45s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.shead{text-align:center;margin:44px 0 18px}
.shead .kicker{color:var(--tc)}
.shead h2{font-size:clamp(40px,8vw,56px);font-weight:700;letter-spacing:-.035em;line-height:1.08;margin-top:6px}
.ssub{font-size:17px;color:var(--mut);margin:10px auto 0;max-width:30em}
.done-tag{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:99px;background:var(--c);color:#fff;font-size:12px;vertical-align:2px}
.intro{font-size:17px;color:var(--mut);text-align:center;max-width:32em;margin:0 auto 36px;line-height:1.6}

/* 路线卡片:可选择 */
.routes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px 40px;padding:6px 22px 14px;scrollbar-width:none}
.routes::-webkit-scrollbar{display:none}
.route{scroll-snap-align:start;text-align:left;background:var(--card);border-radius:22px;padding:22px;box-shadow:0 4px 24px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px;transition:transform .35s var(--spring),box-shadow .3s}
.route:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.09)}
.route:active{transform:scale(.98)}
.route .tg{font-size:12px;font-weight:600;color:var(--tc);display:flex;justify-content:space-between;gap:8px}
.route .tg em{font-style:normal;color:var(--faint);font-weight:500}
.route h3{font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.02em}
.route p{font-size:14px;color:var(--mut);line-height:1.6}
.route.sel{box-shadow:0 0 0 2.5px var(--c),0 10px 30px rgba(0,0,0,.08)}
.route.sel .tg em{color:var(--tc)}

/* 分组列表 */
.quests{display:flex;flex-direction:column;gap:14px}
.quest{background:var(--card);border-radius:22px;box-shadow:0 4px 24px rgba(0,0,0,.05);transition:box-shadow .3s}
.quest.open{box-shadow:0 8px 32px rgba(0,0,0,.08)}
.qh{width:100%;display:flex;align-items:center;gap:14px;padding:18px 22px;text-align:left;border-radius:22px}
.mini{width:30px;height:30px;flex:none}
.mini circle{fill:none;stroke-width:3.2;stroke-linecap:round}
.mini .tr{stroke:var(--c);opacity:.16}
.mini .pr{stroke:var(--c);transition:stroke-dashoffset .7s var(--ease)}
.quest.full .mini .tr{opacity:1}
.qt{flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.35}
.qc{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.quest.full .qc{color:var(--tc);font-weight:600}
.chev{width:12px;height:12px;flex:none;color:#c7c7cc;transition:transform .4s var(--spring)}
.quest.open .chev{transform:rotate(90deg)}
.qb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.quest.open .qb{grid-template-rows:1fr}
.qb>div{min-height:0;overflow:hidden;padding:0 22px}
.quest:not(.open) .qb>div{visibility:hidden;transition:visibility 0s .45s}
.qb>div>:last-child{margin-bottom:14px}
.nt{font-size:14px;color:var(--mut);background:var(--fill);border-radius:14px;padding:12px 14px;margin-bottom:4px}

/* 事项 */
.it{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:2px}
.it:first-of-type{border-top:0}
.nt+.it{border-top:0}
.tx{flex:1;min-width:0;font-size:16px;line-height:1.5;transition:color .3s}
.it.done .tx{color:var(--faint)}
.cb{width:26px;height:26px;flex:none;margin-top:-2px}
.cb svg{width:26px;height:26px;display:block;overflow:visible}
.cb .o{fill:none;stroke:#c7c7cc;stroke-width:1.6;transition:stroke .25s}
.cb .f{fill:var(--c);transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .4s var(--spring)}
.cb path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .28s .12s var(--ease)}
.it:hover .o{stroke:var(--c)}
.it.done .o{stroke:var(--c)}
.it.done .f{transform:scale(1)}
.it.done path{stroke-dashoffset:0}
.it:active .cb{transform:scale(.88);transition:transform .1s}
.x{color:var(--faint);font-size:20px;line-height:1;padding:0 4px;opacity:0;transition:opacity .2s}
.it:hover .x,.x:focus-visible{opacity:1}
@media (hover:none){.x{opacity:1}}

/* 新事项 */
.add{display:flex;align-items:center;gap:14px;padding:12px 0 2px;border-top:1px solid var(--line)}
.add .plus{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--c);font-size:22px;line-height:1;font-weight:300}
.add input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:4px 0}
.add input::placeholder{color:var(--faint)}
.add input:focus{outline:none}
.add button{background:var(--c);color:#fff;border-radius:99px;padding:5px 14px;font-size:14px;font-weight:500;opacity:0;transform:scale(.8);pointer-events:none;transition:opacity .2s,transform .3s var(--spring)}
.add input:not(:placeholder-shown)+button{opacity:1;transform:none;pointer-events:auto}

/* 底部时间线 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:72px}
.step{font-size:13px;color:var(--mut);line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
.step b{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:3px}
.step b i{width:8px;height:8px;border-radius:50%}
.foot{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:40px;font-size:12px;color:var(--faint)}
.reset{font-size:12px;color:var(--mut)}
.reset:hover{color:var(--ink)}

/* 反馈 */
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,24px) scale(.96);background:rgba(29,29,31,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;border-radius:99px;padding:11px 22px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s,transform .45s var(--spring);z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.xpf{position:fixed;z-index:60;pointer-events:none;font-size:13px;font-weight:700;color:var(--tc)}


/* 玻璃质感:背后一层缓慢漂移的彩色光斑,卡片半透明磨砂 */
:root{--line:rgba(60,60,90,.09)}
body{background:#e9ebef}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:#ffffff}
.aurora i:nth-child(2){width:40vmax;height:40vmax;right:-12vmax;top:10vmax;background:#d5d8df;animation-duration:26s;animation-delay:-6s}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:8vmax;bottom:-14vmax;background:#ffffff;animation-duration:30s;animation-delay:-12s}
.aurora i:nth-child(4){width:30vmax;height:30vmax;right:6vmax;bottom:4vmax;background:#cfd3db;opacity:.5;animation-duration:24s;animation-delay:-3s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}
.overview,.route,.quest,.seg{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 32px rgba(60,70,120,.10)}
.seg{border-radius:16px;padding:3px}
.ind{background:rgba(255,255,255,.9);box-shadow:0 3px 10px rgba(60,70,120,.16)}
.quest.open{background:rgba(255,255,255,.62);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 14px 44px rgba(60,70,120,.15)}
.route:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 44px rgba(60,70,120,.15)}
.route.sel{background:rgba(255,255,255,.68);box-shadow:0 0 0 2.5px var(--c),inset 0 1px 0 rgba(255,255,255,.9),0 14px 40px rgba(60,70,120,.15)}
.navwrap.stuck{background:rgba(233,235,239,.5)}
.nt{background:rgba(255,255,255,.55)}
.overview.glow{animation:glow2 1.2s var(--ease)}
@keyframes glow2{30%{box-shadow:0 0 0 6px rgba(191,90,242,.2),inset 0 1px 0 rgba(255,255,255,.9),0 8px 32px rgba(60,70,120,.10)}}

/* 总进度:简化为一行数字 + 一根进度条 */
.overview{display:flex;flex-direction:column;gap:14px;max-width:520px;padding:26px 30px;text-align:left}
.overview .pct{justify-content:space-between;align-items:baseline}
.overview .pct b{font-size:48px}
.overview .xp{height:8px}
.overview .xp i{background:var(--ink)}

/* 顶部:一张玻璃卡,标题、天数和总进度放在一起 */
.hero{text-align:left;margin:56px 0 0;padding:34px 36px 30px;border-radius:30px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 32px rgba(60,70,120,.10)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
.hero-top .kicker{font-size:13px;color:var(--mut);font-weight:500;letter-spacing:.02em}
.day{background:rgba(255,255,255,.7);border-radius:99px;padding:4px 12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hero h1{white-space:nowrap;font-size:clamp(34px,9vw,60px);letter-spacing:-.04em;margin-top:18px;line-height:1.08}
.hero .lede{font-size:17px;margin:12px 0 0;max-width:none}
.hero .overview{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:24px 0 0;margin:24px 0 0;max-width:none;border-top:1px solid var(--line);border-radius:0}
.hero .overview{align-items:stretch}
.hero .overview .pct b{font-size:40px}
.hero.glow,.overview.glow{animation:none}

/* 去掉彩色渐变:数字和进度条用纯色 */
.pct b{background:none;-webkit-text-fill-color:var(--ink);color:var(--ink)}
.xp i{background:var(--ink)}
.aurora i{opacity:.8}

.sh{font-size:13px;font-weight:600;color:var(--tc);margin:16px 0 2px;letter-spacing:.02em}
.sh+.it{border-top:0}

/* 首选城市地图卡 */
.grouptitle{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:34px 4px 14px}
.spotcard{border-radius:26px;margin-bottom:18px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 32px rgba(60,70,120,.10)}
.sc-head{display:flex;align-items:center;gap:14px;padding:20px 22px 4px}
.sc-t{flex:1;min-width:0}
.sc-t h3{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.sc-t p{font-size:13px;color:var(--mut)}
.spotcard .qc{font-size:14px;color:var(--mut)}
.sc-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start;padding:8px 18px 18px}
.smap{width:100%}
.smap svg{width:100%;height:auto;max-height:440px;display:block;margin:0 auto}
.smap-note{font-size:11px;color:var(--faint);text-align:center;margin-top:-4px}
.lake{fill:#dbe8f1}
.river{fill:none;stroke:#cfe0ec;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.dl{font-size:11px;fill:#9fb3c2;letter-spacing:.2em}
.route-line{fill:none;stroke:var(--c);stroke-opacity:.55;stroke-width:2.2;stroke-dasharray:6 7;stroke-linecap:round;stroke-linejoin:round;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pin{cursor:pointer;outline:none}
.pin .pc{fill:#fff;stroke:var(--c);stroke-width:2;transition:fill .25s,transform .35s var(--spring);transform-box:fill-box;transform-origin:center}
.pin .pn{font-size:12px;font-weight:700;fill:var(--tc);pointer-events:none}
.pin .pl{font-size:14px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.pin .pulse{fill:var(--c);opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.pin:hover .pc,.pin:focus-visible .pc{transform:scale(1.15)}
.pin.on .pc{fill:var(--c);transform:scale(1.2)}
.pin.on .pn{fill:#fff}
.pin.on .pulse{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.35;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.pin.got:not(.on) .pc{fill:var(--c);fill-opacity:.2}
.pin.alt .pc{stroke-dasharray:3 3}
.pin.alt .pl{fill:var(--mut)}
.sdet{padding:0;min-width:0}
.sc-body{align-items:stretch !important}
.sdet{display:flex;flex-direction:column}
.sdet-in{display:flex;flex-direction:column;flex:1}
.sdet-in .spn{margin-top:auto}
.sdet-in .slinks{margin-bottom:16px}
.sdet.swap .sdet-in{animation:pin .4s var(--ease)}
.stop{font-size:13px;font-weight:600;color:var(--tc)}
.sdet h4{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin:4px 0 6px}
.hi{font-size:15px;color:var(--mut);line-height:1.55}
.bt{font-size:13px;font-weight:600;color:var(--ink);margin:16px 0 4px}
.sdet ul{margin:0;padding:0;list-style:none}
.sdet li{position:relative;padding:5px 0 5px 16px;font-size:15px;line-height:1.5}
.sdet li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.tipx{margin-top:14px;font-size:14px;color:var(--mut);background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px;line-height:1.55}
.xhs{margin-top:16px}
.xhs ul{list-style:none;padding:0;margin:6px 0 0}
.xhs li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:14px;line-height:1.45}
.xhs li::before{display:none!important;content:none!important}
.xhs li a{flex:1;min-width:0;color:var(--ink);text-decoration:none}
.xhs li a:hover{text-decoration:underline}
.xhs .xapp{flex:none;font-size:11px;color:#4E7262;border:1px solid rgba(78,114,98,.35);border-radius:999px;padding:1px 7px;text-decoration:none}
.xhs .xm{flex:none;font-size:12px;color:var(--mut)}
.xhs .xdel{flex:none;border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer;padding:0 2px}
.xhs .xmore{display:inline-block;margin-top:8px;font-size:13px;color:#4E7262;text-decoration:none}
.xrow{display:flex;justify-content:space-between;align-items:center}
.xph{cursor:pointer}
.ph[hidden]{display:none!important}
.xadd{display:flex;gap:6px;margin-top:10px}

/* ---------- 数据 ---------- */
function groupsOf(sec){
  const gs = sec.groups.map((g,gi)=>Object.assign({}, g, {gi, sid:sec.id, cust:g.wish||null}, g.sections?{items:[].concat(...g.sections.map(x=>x.items))}:{}));
  gs.push({name:"我自己添加的", gi:"x", sid:sec.id, cust:sec.id, items:[], mine:true});
  return gs;
}
function entries(g){
  const base = g.items.map((t,i)=>({id:g.sid+"-"+g.gi+"-"+i, text:t, custom:false}));
  const cu = g.cust ? (state.custom[g.cust]||[]).map((t,i)=>({id:g.cust+"-c-"+i, text:t, custom:true, cust:g.cust, idx:i})) : [];
  return base.concat(cu);
}
function gStat(g){ const es = entries(g); return {done:es.filter(e=>state.checked[e.id]).length, total:es.length}; }
function sStat(sec){ return groupsOf(sec).reduce((a,g)=>{ const s=gStat(g); a.done+=s.done; a.total+=s.total; return a; },{done:0,total:0}); }
function aStat(){ return SECTIONS.reduce((a,s)=>{ const t=sStat(s); a.done+=t.done; a.total+=t.total; return a; },{done:0,total:0}); }
function secOfId(id){ return SECTIONS.find(s=>id.startsWith(s.id+"-") || s.groups.some(g=>g.wish && id.startsWith(g.wish+"-"))); }
function groupOfId(id){ const sec = secOfId(id); return groupsOf(sec).find(g=>entries(g).some(e=>e.id===id)); }
function isFull(g){ const t = gStat(g); return t.total>0 && t.done===t.total; }
function addItem(cust, text){ (state.custom[cust] = state.custom[cust] || []).push(text); save(); }
function delItem(cust, idx){
  state.custom[cust].splice(idx,1);
  const pre = cust+"-c-", nc = {};
  Object.keys(state.checked).forEach(k=>{
    if (k.startsWith(pre)) { const n = +k.slice(pre.length); if (n<idx) nc[k]=1; else if (n>idx) nc[pre+(n-1)]=1; }
    else nc[k]=1;
  });
  state.checked = nc; save();
}
const lvOf = done => Math.floor(done/10)+1;
const pctOf = t => t.total ? t.done/t.total : 0;

}

let shownPct = 0;
function countTo(el, from, to){
  if (reduce || from===to) { el.textContent = to+"%"; return; }
  const t0 = performance.now(), d = 700;
  (function f(t){ const k = Math.min(1,(t-t0)/d), e = 1-Math.pow(1-k,3); el.textContent = Math.round(from+(to-from)*e)+"%"; if (k<1) requestAnimationFrame(f); })(t0);
}
function update(){
  renderChina();
  const A = aStat(), pct = Math.round(pctOf(A)*100);
  SECTIONS.forEach((s,i)=>{
    const t = sStat(s), c = 2*Math.PI*RADII[i];
    const ring = document.querySelector('[data-ring="'+s.id+'"]'); if (ring) ring.setAttribute("stroke-dashoffset", c*(1-pctOf(t)));
    const lg = document.querySelector('[data-lg="'+s.id+'"]'); if (lg) lg.textContent = t.done+"/"+t.total;
    const tc = document.querySelector('[data-tabct="'+s.id+'"]'); if (tc) tc.textContent = t.done+"/"+t.total;
  });
  countTo($("#pct"), shownPct, pct); shownPct = pct;
  $("#pctsub").textContent = "已完成 "+A.done+" / "+A.total;
  const lv = lvOf(A.done), all = []; SECTIONS.forEach(s=>groupsOf(s).forEach(g=>{ if(!g.mine) all.push(g); }));
  $("#lv").textContent = "Lv."+lv+" "+LV_TITLES[Math.min(lv-1,LV_TITLES.length-1)];
  $("#lvnote").textContent = "再完成 "+(10-A.done%10)+" 件升级 · 徽章 "+all.filter(isFull).length+"/"+all.length;
  $("#xpbar").style.width = pct+"%";
  const idx = SECTIONS.findIndex(s=>s.id===ui.sec);
  $("#ind").style.setProperty("--i", idx);
  document.querySelectorAll(".tab").forEach(b=>{ const on = b.dataset.sec===ui.sec; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); });
  const sec = SECTIONS[idx], S = sStat(sec);
  $("#donetag").innerHTML = S.total && S.done===S.total ? '<span class="done-tag">全部完成</span>' : "";
  document.querySelectorAll(".pin,.tpin").forEach(p=>p.classList.toggle("got", !!(p.dataset.pid && state.checked[p.dataset.pid])));
  groupsOf(sec).forEach(g=>{
    const q = document.querySelector('[data-g="'+g.sid+'-'+g.gi+'"]'); if (!q) return;
    const t = gStat(g), full = t.total>0 && t.done===t.total, c = 2*Math.PI*11;

    const mp = q.querySelector(".mini .pr"); if (mp) mp.setAttribute("stroke-dashoffset", c*(1-pctOf(t)));
    q.querySelector(".qc").textContent = full ? "完成" : t.total ? t.done+" / "+t.total : "空";
  });
}

function burst(el, big, color){
  if (reduce || !el || !el.animate) return;
  const r = el.getBoundingClientRect(), n = big?26:9, cx = r.left+r.width/2, cy = r.top+r.height/2;
  const cols = big ? ["#0a84ff","#ff375f","#30d158","#bf5af2","#ffd60a"] : [color, color, "#ffd60a"];
  for (let i=0;i<n;i++){
    const d = document.createElement("i"), a = Math.random()*Math.PI*2, dist = (big?110:34)+Math.random()*(big?90:26), sz = big?7:5;
    d.style.cssText = "position:fixed;left:"+(cx-sz/2)+"px;top:"+(cy-sz/2)+"px;width:"+sz+"px;height:"+sz+"px;border-radius:50%;background:"+cols[i%cols.length]+";pointer-events:none;z-index:70";
    document.body.appendChild(d);
    d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*dist+"px,"+Math.sin(a)*dist+"px) scale(.2)",opacity:0}],{duration:600+Math.random()*300,easing:"cubic-bezier(.15,.8,.3,1)"}).onfinish = ()=>d.remove();
  }
}
function floatXp(el){

  s.style.setProperty("--tc", getComputedStyle($("#panel")).getPropertyValue("--tc"));
  document.body.appendChild(s);
  s.animate([{transform:"translateY(4px)",opacity:0},{transform:"translateY(-6px)",opacity:1,offset:.25},{transform:"translateY(-34px)",opacity:0}],{duration:1000,easing:"ease-out"}).onfinish = ()=>s.remove();
}
let toastT;
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1700); }
function tick(){ try{ if (navigator.vibrate) navigator.vibrate(8); }catch(e){} }

function doToggle(el){
  const id = el.dataset.toggle, sec = secOfId(id), g = groupOfId(id);
  const secBefore = sStat(sec), grpFull0 = isFull(g), lv0 = lvOf(aStat().done);
  const on = !state.checked[id];
  if (on) state.checked[id] = true; else delete state.checked[id];
  save();
  el.classList.toggle("done", on); el.setAttribute("aria-checked", on);
  update();
  if (!on) return;
  tick();
  const cb = el.querySelector(".cb"), color = COLHEX[sec.id];
  setTimeout(()=>{ burst(cb, false, color); floatXp(cb); }, 120);
  const secAfter = sStat(sec), lv1 = lvOf(aStat().done);
  if (secAfter.total && secAfter.done===secAfter.total && secBefore.done<secBefore.total){ setTimeout(()=>burst(cb,true),200); toast("「"+sec.short+"」全部完成"); }
  else if (!grpFull0 && isFull(g)){ setTimeout(()=>burst(cb,true),200); toast("获得徽章 · "+g.name.split(/[:(]/)[0]); }
  else if (lv1>lv0){ setTimeout(()=>burst(cb,true),200); toast("升级到 Lv."+lv1+" · "+LV_TITLES[Math.min(lv1-1,LV_TITLES.length-1)]); const o=$("#overview"); o.classList.remove("glow"); void o.offsetWidth; o.classList.add("glow"); }
  else toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]);
}

/* ---------- 交互 ---------- */
document.addEventListener("click", e=>{
  const s = e.target.closest("[data-sec]");
  if (s) {
    const changed = s.dataset.sec !== ui.sec;
    ui.sec = s.dataset.sec; saveUi(); update();
    if (changed) renderPanel(true);
    if (s.classList.contains("lg")) $("#navwrap").scrollIntoView({behavior: reduce?"auto":"smooth"});
    return;
  }
  const o = e.target.closest("[data-open]");
  if (o) { const m = openMap[ui.sec], k = o.dataset.open; m[k] = !m[k]; const q = o.closest(".quest"); q.classList.toggle("open", m[k]); o.setAttribute("aria-expanded", m[k]); return; }
  const tb = e.target.closest("[data-tips]");
  if (tb) { e.stopPropagation(); openTips(tb.dataset.tips); return; }
  if (e.target.closest("[data-closetips]")) { closeTips(); return; }
  const ac = e.target.closest("[data-allcards]");
  if (ac) { const cards = [...document.querySelectorAll(".spotcard")], anyClosed = cards.some(c=>!c.classList.contains("open")); cards.forEach(c=>{ c.classList.toggle("open", anyClosed); spotOpen[c.dataset.sc] = anyClosed; c.querySelector(".sc-head").setAttribute("aria-expanded", anyClosed); }); ac.textContent = anyClosed ? "全部收起" : "全部展开"; return; }
  const cd = e.target.closest("[data-citydone]");
  if (cd) { const k = cd.dataset.citydone, id = 'city-'+k, on = !state.checked[id]; if (on) state.checked[id] = true; else delete state.checked[id]; save();
    cd.classList.toggle("done", on); cd.setAttribute("aria-checked", on); const c = cd.closest(".spotcard"); if (c) c.classList.toggle("citydone", on);
    if (on){ tick(); setTimeout(()=>{ burst(cd.querySelector(".cb"), true, "#6B9080"); }, 120); toast("「"+SPOTS[k].title+"」打卡完成"); } renderChina(); return; }
  const tc = e.target.closest("[data-toggle-card]");
  if (tc) { const k = tc.dataset.toggleCard, c = tc.closest(".spotcard"); spotOpen[k] = !c.classList.contains("open"); c.classList.toggle("open", spotOpen[k]); tc.setAttribute("aria-expanded", spotOpen[k]); if (spotOpen[k] && !reduce) setTimeout(()=>c.scrollIntoView({behavior:"smooth", block:"start"}), 80); return; }
  const mm = e.target.closest("[data-mmode]");
  if (mm) { const kk = mm.dataset.mmode; mapMode[kk] = mm.dataset.v; setSpot(kk, spotActive[kk]||0); return; }
  const md = e.target.closest("[data-mday]");
  if (md) { const kk = md.dataset.mday; mapDay[kk] = md.dataset.d==="" ? null : +md.dataset.d; redrawMap(kk); return; }
  const mn = e.target.closest("[data-mnz]");
  if (mn) { const kk = mn.dataset.mnz; mapNz[kk] = !mapNz[kk]; redrawMap(kk); return; }
  const czb = e.target.closest("[data-cz]");
  if (czb) { const v = czb.dataset.cz; if (v==="full"){ cmFull = !cmFull; document.body.classList.toggle("cm-lock", cmFull); renderChina(); return; } if (v==="reset"){ cz.x=0; cz.y=0; cz.w=640; czApply(); } else czZoom(v==="in"?.6:1/.6); return; }
  const cc = e.target.closest("[data-city]");
  if (cc) { const n = cc.dataset.city, k = NAME2TRIP[n]; let on;
    if (k && TRIP_MAP[k].length>1) { const ck = 'city-'+k;
      if (state.checked[ck]) { delete state.checked[ck]; TRIP_MAP[k].forEach(x=>{ if (x!==n) state.checked['visit-'+x] = true; }); delete state.checked['visit-'+n]; on = false;
        const card = document.querySelector('.spotcard[data-sc="'+k+'"]'); if (card){ card.classList.remove("citydone"); const c2 = card.querySelector(".citychk"); if (c2){ c2.classList.remove("done"); c2.setAttribute("aria-checked", false); } } }
      else { const id = 'visit-'+n; on = !state.checked[id]; if (on) state.checked[id] = true; else delete state.checked[id]; } }
    else if (k) { const id = 'city-'+k; on = !state.checked[id]; if (on) state.checked[id] = true; else delete state.checked[id];
      const card = document.querySelector('.spotcard[data-sc="'+k+'"]'); if (card){ card.classList.toggle("citydone", on); const ck = card.querySelector(".citychk"); if (ck){ ck.classList.toggle("done", on); ck.setAttribute("aria-checked", on); } } }
    else { const id = 'visit-'+n; on = !state.checked[id]; if (on) state.checked[id] = true; else delete state.checked[id]; }
    save(); const keep = {...cz}; renderChina(); Object.assign(cz, keep); czApply();
    if (on){ tick(); toast("打卡 "+n); } return; }
  const gc = e.target.closest("[data-gocity]");
  if (gc) { const k = gc.dataset.gocity, c = document.querySelector('.spotcard[data-sc="'+k+'"]'); if (c) { if (!c.classList.contains("open")) c.querySelector("[data-toggle-card]").click(); else c.scrollIntoView({behavior: reduce?"auto":"smooth", block:"start"}); } return; }
  const gt = e.target.closest("[data-goto]");
  if (gt) { setSpot(gt.dataset.goto, +gt.dataset.i); return; }
  const pin = e.target.closest("[data-pin]");
  if (pin) { setSpot(pin.dataset.pin, +pin.dataset.i); return; }
  const st = e.target.closest("[data-step]");
  if (st) { const kk = st.dataset.key, ord = spotOrder(SPOTS[kk]), p = ord.indexOf(spotActive[kk]||0), n = ord.length; setSpot(kk, ord[(p + (+st.dataset.step) + n) % n]); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const c = document.getElementById("city-"+j.dataset.jump); if (c) { c.scrollIntoView({behavior: reduce?"auto":"smooth", block:"start"}); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); } return; }
  const r = e.target.closest("[data-route]");
  if (r) { const i = +r.dataset.route; state.route = state.route===i ? null : i; save();
    document.querySelectorAll("[data-route]").forEach(b=>{ const on = +b.dataset.route===state.route; b.classList.toggle("sel",on); b.querySelector("em").textContent = on?"已选择 ✓":"选这条"; });
    if (state.route===i) { tick(); toast("已选择路线 "+"ABC"[i]); } return; }
  const d = e.target.closest("[data-del]");
  if (d) { e.stopPropagation(); delItem(d.dataset.del, +d.dataset.idx); buildPanel(); update(); toast("已删除"); return; }
  const gb = e.target.closest(".gobtn[data-toggle]");
  if (gb) { doToggle(gb); return; }
  if (e.target.closest("form,input,button,a")) return;
  const t = e.target.closest("[data-toggle]");
  if (t) doToggle(t);
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape") closeTips();
  if ((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("[data-toggle-card],[data-citydone]")) { e.preventDefault(); e.target.click(); return; }
  if ((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("[data-jump],[data-pin],.dayjump,[data-zoomday]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); return; }
  if ((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("[data-toggle]")) { e.preventDefault(); doToggle(e.target); }
});
document.addEventListener("submit", e=>{
  const f = e.target.closest(".add"); if (!f) return;
  e.preventDefault();
  const v = f.querySelector("input").value.trim(); if (!v) return;
  const cust = f.dataset.cust; addItem(cust, v); buildPanel(); update();
  const inp = document.getElementById("in-"+cust); if (inp) inp.focus();
  toast("已添加");
});
$("#reset").addEventListener("click", e=>{
  const b = e.currentTarget, txt = "清除所有勾选和自己添加的内容";
  if (b.dataset.sure==="1") { state = {checked:{},custom:{}}; save(); buildPanel(); update(); b.dataset.sure=""; b.textContent=txt; toast("已清除"); }
  else { b.dataset.sure="1"; b.textContent="再点一次确认清除"; setTimeout(()=>{ b.dataset.sure=""; b.textContent=txt; },4000); }
});

io.observe(nw);

buildOverview(); buildNav(); buildPanel(); phMountAll(document);
requestAnimationFrame(()=>requestAnimationFrame(update));
